<!DOCTYPE html>
<html>
  {{- partial "head.html" . -}}
  <body>
    <header>
      {{- partial "header.html" . -}}
    </header>
    <main>
      {{- block "main" . }}{{- end }}
    </main>
    <footer>
      {{- partial "footer.html" . -}}
    </footer>
    {{ $js := resources.Get "js/rocinante.js" | resources.Minify }}
    {{- if isset .Site.Params "email" }}
      <script src="{{ $js.RelPermalink }}"></script>
    {{- end -}}
  </body>
</html>
